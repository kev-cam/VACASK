# diaspora.conf - the peers of this repository, what moves between them and
# what an import must pass.  Read by diaspora (github.com/kev-cam/diaspora).
# Values run to the end of the line as written; comments are whole lines.
# Settings for one machine only go in diaspora.local.conf (not committed).

[diaspora]
	target = main
	import = bugfix security perf
	ignore = docs ci style
	export = bugfix

# Arpad Buermen's VACASK, which this repository was forked from.
[peer "arpad"]
	url = https://codeberg.org/arpadbuermen/VACASK.git
	branch = main

# Commands run in the import worktree ($DIASPORA_SRC), which has a build
# tree of its own ($DIASPORA_BUILD, kept between runs): the build in this
# checkout is not touched.  Configured as that build is: with the C
# interface and the Cadnip parsers (a third of the tests are theirs), as a
# Ninja tree, which smak cannot drive yet, so cmake is called straight
# through and ninja builds.  Boost and OpenVAF are where this machine has
# them unless VACASK_BOOST_DIR and VACASK_OPENVAF_DIR say otherwise.  ninja
# runs cmake again by itself when an import changes a CMake file; after a
# change to the options below, remove the build tree.
[test "compile"]
	run = [ -f "$DIASPORA_BUILD/build.ninja" ] || smak -cmake-passthrough -S "$DIASPORA_SRC" -B "$DIASPORA_BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release -DVACASK_CINTERFACE=ON -DCADNIP_PARSERS=ON -DBoost_DIR="${VACASK_BOOST_DIR:-$HOME/.local/boost-1.88.0/lib/cmake/Boost-1.88.0}" -DOPENVAF_DIR="${VACASK_OPENVAF_DIR:-$DIASPORA_REPO/openvaf-cache}" -DSuiteSparse_DIR=/usr -DTOMLPP_DIR=/usr/local
	run = ninja -C "$DIASPORA_BUILD" -j"$(nproc)"
	timeout = 2h

# All of VACASK's own tests (ctest).  One of them needs the IHP PDK and
# fails without it, so the gate is that no test fails that did not fail
# before the import; a new failure is run a second time before it counts.
# ctest exits 8 when tests fail and lists them in LastTestsFailed.log.
[test "full-regression"]
	needs = compile
	run = cd "$DIASPORA_BUILD" && rm -f Testing/Temporary/LastTestsFailed.log && { ctest -j 8 --timeout 900; rc=$?; [ $rc = 0 ] || [ $rc = 8 ]; }
	run = { sed 's/^[0-9]*://' Testing/Temporary/LastTestsFailed.log 2>/dev/null || true; } > "$DIASPORA_FAILURES"
	pass = no-new-failures
	retry = 1
	timeout = 2h

# Every import passes the full regression, whatever kind of change it is.
[require]
	default = full-regression
